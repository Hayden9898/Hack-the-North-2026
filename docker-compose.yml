services:
  db:
    # Pinned after local smoke test (see reports/sponsor-evidence.md). Tiger Cloud runs PG17 + TimescaleDB 2.x.
    image: timescale/timescaledb:latest-pg17@sha256:c79fa5891443d1cdf6de5258d4c2bdb8cde29052c45df2062b13d351e0202005
    container_name: logorder-db
    environment:
      POSTGRES_USER: logorder
      POSTGRES_PASSWORD: logorder
      POSTGRES_DB: logorder
    ports:
      - "5433:5432"
    volumes:
      - logorder-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "max_connections=100"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logorder -d logorder"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Deployment parity, opt-in: `docker compose --profile app up --build` runs the exact image Railway runs
  # (API + built console on :8000, worker beside it) against the local TimescaleDB. Not started by `db-up`.
  api:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://logorder:logorder@db:5432/logorder
      TEST_DATABASE_URL: ""
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-local-operator-secret}
      INGEST_TOKEN: ${INGEST_TOKEN:-local-ingest-token}
      APP_BASE_URL: http://127.0.0.1:8000
      SLACK_MODE: preview
    command: ["sh", "-c", "python -m scripts.migrate && python -m scripts.serve_api"]
    ports:
      - "8000:8000"

  worker:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://logorder:logorder@db:5432/logorder
      TEST_DATABASE_URL: ""
      # Alert links are built by the detector (this container); without it they point at the Vite dev port.
      APP_BASE_URL: http://127.0.0.1:8000
      SLACK_MODE: preview
    command: ["sh", "-c", "python -m scripts.wait_for_db && python -m scripts.serve_worker"]

volumes:
  logorder-pgdata:
