[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = [
  "integration: requires TEST_DATABASE_URL (real TimescaleDB)",
  "e2e: end-to-end flows through API + workers against the test database",
  "external: requires real provider credentials; never run implicitly",
]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend", "ml", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
