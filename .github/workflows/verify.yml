name: Product acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python tasks.py verify-frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-human-review
          path: reports/verification
          retention-days: 14
  backend:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: docker compose up -d --wait db
      - run: python tasks.py migrate
      - run: python tasks.py verify-backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-human-review
          path: reports/verification
          retention-days: 14
      - run: docker compose down
        if: always()
